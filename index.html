<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kiểm tra Tên và Ngày sinh</title>

    <!-- Link Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('./logo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
        }

        .card {
            width: 580px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.9);
            padding: 35px;
            backdrop-filter: blur(6px);
        }

        #result {
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="mb-3">
            <label class="form-label">Họ và tên (Không dấu):</label>
            <input type="text" id="name" class="form-control" placeholder="Nhập họ và tên">
        </div>

        <div class="mb-4">
            <label class="form-label">Ngày sinh:</label>
            <div class="d-flex gap-2">
                <input type="number" id="day" class="form-control" placeholder="Ngày" min="1" max="31">
                <input type="number" id="month" class="form-control" placeholder="Tháng" min="1" max="12">
                <input type="number" id="year" class="form-control" placeholder="Năm">
            </div>
        </div>

        <button class="btn btn-danger w-100" onclick="checkUser()">Kiểm tra</button>
        <p id="result" class="text-center mt-3"></p>
    </div>

    <script>
        function checkUser() {
            const correctInfo = {
                name: "Nguyen Nhu Y",
                birthDate: new Date("2003-07-07"),
            };

            const inputName = document.getElementById("name").value.trim();
            const inputDay = document.getElementById("day").value;
            const inputMonth = document.getElementById("month").value;
            const inputYear = document.getElementById("year").value;
            const result = document.getElementById("result");

            // Chuẩn hóa tên để so sánh không phân biệt hoa/thường
            const normalize = (str) => str.toLowerCase().replace(/\s+/g, " ");
            const isNameMatch = normalize(inputName) === normalize(correctInfo.name);

            // Tạo đối tượng ngày người dùng nhập
            const userDate = new Date(`${inputYear}-${inputMonth}-${inputDay}`);
            if (isNaN(userDate.getTime())) {
                result.textContent = "❌ Ngày sinh không hợp lệ!";
                result.className = "text-danger text-center mt-3";
                return;
            }

            // So sánh ngày/tháng/năm sinh
            const isDateMatch =
                userDate.getDate() === correctInfo.birthDate.getDate() &&
                userDate.getMonth() === correctInfo.birthDate.getMonth() &&
                userDate.getFullYear() === correctInfo.birthDate.getFullYear();

            // ✅ Nếu đúng cả tên và ngày sinh → chuyển sang wish.html
            if (isNameMatch && isDateMatch) {
                window.location.href = "wish.html"; // chuyển trang
            } else {
                result.textContent = "❌ Sai tên hoặc ngày sinh!";
                result.className = "text-danger text-center mt-3";
            }
        }
    </script>
</body>

</html>
